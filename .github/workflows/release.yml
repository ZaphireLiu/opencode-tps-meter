name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Pack release assets
        run: |
          mkdir -p assets
          bun pm pack --ignore-scripts --destination assets
          tar -czf assets/opencode-tps-meter-dist.tar.gz -C dist .

      - name: Publish git-installable release branches
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The release branch carries the built dist/ so `opencode plugin add
          # git+https://...#release` works without a build step on the user's machine.
          git checkout -B release
          git add -f dist
          git commit -m "release: ${GITHUB_REF_NAME}"
          git push --force origin release

          # Pinned branch for this exact version.
          git branch -f "release-${VERSION}" HEAD
          git push origin "release-${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
